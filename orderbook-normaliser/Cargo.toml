[package]
name = "orderbook-normaliser"
version = "0.1.0"
edition = "2024"

[lib]
name = "orderbook_normaliser"
path = "src/lib.rs"

[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Decimal arithmetic
rust_decimal = { version = "1", features = ["serde"] }
rust_decimal_macros = "1"
