[package]
name = "orderbook-core"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
tokio = { version = "1", features = ["full"] }
log = "0.4"
notify = "8.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
alloy = "1.0.22"
reqwest = "0.12.22"
itertools = "0.14.0"
slab = "0.4"
strum_macros = "0.27.2"
dirs = "5"
lapin = { version = "2.5.4", features = [
    "rustls-native-certs",
], default-features = false }

[lints]
workspace = true

[dev-dependencies]
rand = "0.9.1"
