[package]
name = "binaries"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
server = { path = "../server" }
orderbook-core = { path = "../orderbook-core" }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3.31"
tokio-tungstenite = "0.27.0"
clap = { version = "4.5.42", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
itertools = "0.14.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lapin = "2.5.0"
reqwest = "0.12"
alloy = "1.0.22"

[lints]
workspace = true
